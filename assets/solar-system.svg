      .orbit-4 {
        transform-origin: 420px 220px;
        animation: spin-4 56s linear infinite;
      }
      .counter-4 {
        transform-origin: 634px 220px;
        animation: counter-spin-4 56s linear infinite;
      }
      @keyframes spin-4 {
        from { transform: rotate(70deg); }
        to { transform: rotate(430deg); }
      }
      @keyframes counter-spin-4 {
        from { transform: rotate(-70deg); }
        to { transform: rotate(-430deg); }
      }
      .comet-fly {
        animation: cometGlide 9s ease-in-out infinite;
      }
      @keyframes cometGlide {
        0%, 100% { transform: translate(0px, 0px); opacity: 0.9; }
        50% { transform: translate(18px, 6px); opacity: 1; }
      }
    </style>
