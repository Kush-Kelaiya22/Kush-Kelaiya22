    <style>
      .orbit-0 {
        transform-origin: 420px 220px;
        animation: spin-0 18s linear infinite;
      }
      .counter-0 {
        transform-origin: 492px 220px;
        animation: counter-spin-0 18s linear infinite;
      }
      @keyframes spin-0 {
        from { transform: rotate(25deg); }
        to { transform: rotate(385deg); }
      }
      @keyframes counter-spin-0 {
        from { transform: rotate(-25deg); }
        to { transform: rotate(-385deg); }
      }
      .orbit-1 {
        transform-origin: 420px 220px;
        animation: spin-1 26s linear infinite;
      }
